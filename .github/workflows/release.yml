name: Build and Release

# Builds libAKDMDesktopMode.dylib and attaches it to a GitHub Release.
#
# Trigger by pushing a tag (v0.1, v1.2.3, ...). The two symbol-resolution
# validators need the game bundle (global-metadata.dat + UnityFramework), which
# is not redistributable, so CI runs only the parts that are self-contained:
# the keyboard state-machine unit tests and the plugin build itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # required to create the release

jobs:
  build:
    # macos-14 was retired on 2026-11-02 ("configuration not supported").
    # macos-15 ships Xcode 16.4 by default, whose SDK includes the Mac Catalyst
    # frameworks the build needs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          swift --version | head -1

      - name: Verify Catalyst frameworks are present
        run: |
          SDK="$(xcrun --show-sdk-path)"
          test -d "$SDK/System/iOSSupport/System/Library/Frameworks" || {
            echo "Mac Catalyst frameworks missing under $SDK"
            exit 1
          }

      - name: Run keyboard unit tests
        run: |
          SDK="$(xcrun --show-sdk-path)"
          mkdir -p build
          xcrun clang++ -std=c++17 -O1 -isysroot "$SDK" \
            -I"$SDK/usr/include/c++/v1" -Isrc \
            tools/test_input.cpp src/AKDMInput.cpp -o build/test_input
          ./build/test_input

      - name: Build release plugin
        run: zsh build.sh

      - name: Build logging plugin
        run: |
          AKDM_ENABLE_LOGGING=1 zsh build.sh
          cp libAKDMDesktopMode.dylib libAKDMDesktopMode-debug.dylib
          # Rebuild with logging off so the main artifact is the release build.
          AKDM_ENABLE_LOGGING=0 zsh build.sh

      - name: Verify artifacts
        run: |
          for f in libAKDMDesktopMode.dylib libAKDMDesktopMode-debug.dylib; do
            test -f "$f"
            file "$f"
            codesign --verify --strict "$f"
            otool -D "$f"
            shasum -a 256 "$f"
          done
          # The release build must not contain the log-format string that only
          # the logging build pulls in.
          if strings -a libAKDMDesktopMode.dylib | grep -q "tick=%lu"; then
            echo "release dylib unexpectedly contains logging format strings"
            exit 1
          fi

      - name: Stage release assets
        id: assets
        run: |
          # Two dylibs only. Their hashes go into the release body (see below),
          # not into a checksum file.
          SHA_MAIN=$(shasum -a 256 libAKDMDesktopMode.dylib | awk '{print $1}')
          SHA_DEBUG=$(shasum -a 256 libAKDMDesktopMode-debug.dylib | awk '{print $1}')
          {
            echo 'sha_main='"$SHA_MAIN"
            echo 'sha_debug='"$SHA_DEBUG"
          } >> "$GITHUB_OUTPUT"
          echo "libAKDMDesktopMode.dylib        sha256 $SHA_MAIN"
          echo "libAKDMDesktopMode-debug.dylib  sha256 $SHA_DEBUG"

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: libAKDMDesktopMode-${{ github.ref_name }}
          path: |
            libAKDMDesktopMode.dylib
            libAKDMDesktopMode-debug.dylib

      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_MAIN: ${{ steps.assets.outputs.sha_main }}
          SHA_DEBUG: ${{ steps.assets.outputs.sha_debug }}
          REPO: ${{ github.repository }}
        run: |
          # Build the full body up front. gh release create attaches assets by
          # first creating a DRAFT and only publishing after every upload
          # succeeds; a later `gh release edit` on that draft can leave it
          # unpublished. So there must be exactly one edit, with --draft=false.
          PREV_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          cat > body.md <<EOF
          ## 校验和

          | 文件 | SHA256 |
          | --- | --- |
          | \`libAKDMDesktopMode.dylib\` | \`$SHA_MAIN\` |
          | \`libAKDMDesktopMode-debug.dylib\` | \`$SHA_DEBUG\` |

          > [!NOTE]
          > Release 由 CI 在 macOS runner 上构建并 ad-hoc 签名，哈希与自行构建不同（签名含
          > 时间戳）。校验下载文件：\`shasum -a 256 <下载的 dylib>\`，与上表比对。
          EOF
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV_TAG...$GITHUB_REF_NAME"
            } >> body.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file body.md \
            libAKDMDesktopMode.dylib \
            libAKDMDesktopMode-debug.dylib
          # Explicitly publish: attaching assets leaves a draft in some gh
          # versions, and --draft=false is idempotent for an already-live release.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          # Fail the job if it is somehow still a draft.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft | grep -q true; then
            echo "release is still a draft after publish"
            exit 1
          fi
